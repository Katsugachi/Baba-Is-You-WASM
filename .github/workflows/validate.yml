name: Validate game data

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 tools/generate_data.py
      - run: python3 tools/validate_data.py
      - run: git diff --exit-code -- web/game-data.json
