<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baba Is You WASM</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#080808;color:#ddd;font:14px/1.4 system-ui,sans-serif;overflow:hidden}
#wrap{height:100%;display:grid;place-items:center;position:relative}
canvas{width:min(100vw,calc(100vh*1.75));height:min(100vh,calc(100vw/1.75));image-rendering:pixelated;background:#080808;outline:none}
#status{position:absolute;left:12px;bottom:10px;color:#777;pointer-events:none;white-space:pre-wrap}
#help{position:absolute;right:12px;bottom:10px;color:#555;text-align:right;pointer-events:none;font-size:12px}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="840" height="480" tabindex="0"></canvas><div id="status">loading…</div><div id="help">arrows move · z undo · r restart<br>space wait</div></div>
<script src="web/vendor/wasmoon.js"></script>
<script src="web/src/app.js"></script>
</body>
</html>
