<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baba Is You WASM</title>
<style>
@font-face{font-family:BabaFont;src:url("Base%20Files/Data/merged.ttf") format("truetype");font-display:block}
html,body{margin:0;width:100%;height:100%;background:#080808;color:#ddd;font:14px/1.4 system-ui,sans-serif;overflow:hidden}
#wrap{height:100%;display:grid;place-items:center;position:relative}
canvas{width:min(100vw,calc(100vh*1.75));height:min(100vh,calc(100vw/1.75));image-rendering:pixelated;background:#080808;outline:none}
#status{display:none;position:absolute;left:12px;bottom:10px;color:#777;pointer-events:none;white-space:pre-wrap}
#help{display:none;position:absolute;right:12px;bottom:10px;color:#555;text-align:right;pointer-events:none;font-size:12px}
#level-select{display:none;position:absolute;left:12px;top:10px;background:#151515;color:#aaa;border:1px solid #333;padding:4px;font:inherit;max-width:45vw}
</style>
</head>
<body>
<div id="wrap"><select id="level-select" aria-label="Level select"></select><canvas id="game" width="840" height="480" tabindex="0"></canvas><div id="status">loading…</div><div id="help">arrows move · z undo · r restart<br>space wait</div></div>
<script src="web/vendor/wasmoon.js"></script>
<script>if(new URLSearchParams(location.search).has("debug"))for(const el of document.querySelectorAll("#status,#help,#level-select"))el.style.display="block"</script>
<script src="web/src/app.js"></script>
</body>
</html>
